name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          F=$(grep -rl "Calculadora de Entregas v7" --include=MainActivity.kt . | head -1)
          if [ -z "$F" ]; then
            echo "VERSAO V7 NAO ENCONTRADA NO REPOSITORIO. MainActivity encontrados:"
            find . -name MainActivity.kt -not -path './.git/*'
            exit 1
          fi
          D="${F%/app/src/main/java/com/calculadora/entregas/MainActivity.kt}"
          echo "Projeto v7 em: $D"
          cd "$D"
          gradle :app:assembleDebug --no-daemon
          echo "APK_DIR=$D" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraEntregas-v7-run${{ github.run_number }}
          path: ${{ env.APK_DIR }}/app/build/outputs/apk/debug/*.apk
