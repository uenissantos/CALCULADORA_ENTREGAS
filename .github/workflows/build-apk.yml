name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Montar projeto com a v8 e compilar
        run: |
          NEW=$(find . -name BuildInfo.kt -not -path './.git/*' | head -1)
          if [ -z "$NEW" ]; then
            echo "V8 NAO ENCONTRADA (sem BuildInfo.kt). Arquivos MainActivity:"
            find . -name MainActivity.kt -not -path './.git/*'
            exit 1
          fi
          APP="${NEW%/src/main/java/com/calculadora/entregas/BuildInfo.kt}"
          CFG=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          CFGDIR=$(dirname "$CFG")
          echo "App v8 em: $APP | Configuração em: $CFGDIR"
          mkdir -p /tmp/proj
          cp "$CFGDIR/settings.gradle.kts" "$CFGDIR/build.gradle.kts" /tmp/proj/
          cp "$CFGDIR/gradle.properties" /tmp/proj/ 2>/dev/null || true
          cp -r "$APP" /tmp/proj/app
          cd /tmp/proj
          gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraEntregas-v8-run${{ github.run_number }}
          path: /tmp/proj/app/build/outputs/apk/debug/*.apk
